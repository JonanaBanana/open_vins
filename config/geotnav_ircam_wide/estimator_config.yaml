%YAML:1.0 # need to specify the file type at the top!
# OpenVINS (ov_msckf) on ircam_wide (thermal, 640x512, 30 Hz, h264) and /imu_apps, monocular.
# Started from config/euroc_mav. Changes for the IR camera at ~100 m above flat ground:
# - Tracking at 15 Hz with 15 clones, so the window spans ~1 s (~10 m at cruise speed), for
#   parallax on points ~100 m away.
# - CLAHE and a lower FAST threshold for the thermal image's low contrast; a 1.5 px measurement
#   noise for the h264 artefacts.
# - Camera intrinsics are fixed (a flat scene cannot calibrate them); extrinsics and the time offset
#   are refined from rough values.
# - Static initialisation: the flights start standing on the ground.

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

calib_cam_extrinsics: true
calib_cam_intrinsics: false
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 15
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.815 # Denmark

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# Off: with ZUPT on, OpenVINS initialises at once while standing (instead of at the take-off jerk)
# and then drifts on the ground, as ZUPT stops after the first motion.
try_zupt: false
zupt_chi2_multipler: 0 # 0: disparity-based only
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: true

# ==================================================================
# ==================================================================

init_window_time: 2.0
init_imu_thresh: 1.5
init_max_disparity: 10.0
init_max_features: 50

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

# ==================================================================
# ==================================================================

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# ==================================================================

# Triangulation limits. The defaults (max_dist 60 m, depth/baseline 40, condition 1e4) reject every
# feature ~100 m below, and with no visual update the filter runs on the IMU alone.
fi_max_dist: 1000
fi_max_baseline: 200
fi_max_cond_number: 50000

use_klt: true
num_pts: 250
fast_threshold: 10
grid_x: 5
grid_y: 4
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 15.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "CLAHE" # NONE, HISTOGRAM, CLAHE

use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# ==================================================================

up_msckf_sigma_px: 1.5
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1.5
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
