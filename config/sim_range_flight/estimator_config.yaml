%YAML:1.0 # need to specify the file type at the top!
# Simulated 100 m flight over flat ground (run_simulation) to test the rangefinder plane constraint against
# ground truth. Monocular downward camera (640x512, equidistant), IMU noise as measured on a multirotor in
# flight, downward rangefinder. Run from the workspace root (sim_traj_path).

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

calib_cam_extrinsics: true
calib_cam_intrinsics: false
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 15
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.815 # Denmark

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# Off: with ZUPT on, OpenVINS initialises at once while standing (instead of at the take-off jerk)
# and then drifts on the ground, as ZUPT stops after the first motion.
try_zupt: false
zupt_chi2_multipler: 0 # 0: disparity-based only
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: true

# ==================================================================
# ==================================================================

init_window_time: 2.0
init_imu_thresh: 1.5
init_max_disparity: 10.0
init_max_features: 50

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

# Global yaw at initialisation = heading of this IMU axis (here x, the nose in FLU), so an external initial
# heading aligns the VIO frame directly. Unset: upstream (arbitrary yaw from gravity alone).
init_heading_axis_in_imu: [ 1.0, 0.0, 0.0 ]

# ==================================================================
# ==================================================================

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
# A TRACK line per camera update: tracks, MSCKF features offered, triangulated and used, SLAM features, speed.
print_track_stats: true

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# ==================================================================

# Triangulation limits. The defaults (max_dist 60 m, condition 1e4) reject every feature ~100 m below, and with
# no visual update the filter runs on the IMU alone. The depth/baseline limit stays at the default 40: features
# with less parallax are dropped (in simulation, keeping them down to 200 made the attitude far worse).
fi_max_dist: 1000
fi_max_baseline: 40
fi_max_cond_number: 50000

use_klt: true
num_pts: 250
fast_threshold: 10
grid_x: 5
grid_y: 4
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 15.0
# Every frame is tracked, propagated and updated at 15 Hz. The window (max_clones: 15) holds the 5 newest frames
# plus 10 keyframes, one every 6th frame: ~4.3 s of baseline for points ~100 m away, with an update every frame.
keyframe_every_n_frames: 6
num_recent_clones: 5
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE

use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# ==================================================================

up_msckf_sigma_px: 1.5
up_msckf_chi2_multipler: 2.5
up_slam_sigma_px: 1.5
up_slam_chi2_multipler: 2.5
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
relative_config_range: "range_chain.yaml"  # the rangefinder (read only with use_range)

# ==================================================================
# Rangefinder plane constraint. The ground is taken as a plane perpendicular to gravity. Each MSCKF
# feature with enough parallax gets one more row: the rangefinder's slant range at the newest clone it is seen
# from, predicted as (clone z - feature z) / cos(tilt). New SLAM features are created with the range.
# ==================================================================
use_range: true
range_sigma: 3.0               # [m] per feature: how far it sits off the plane (vegetation, roofs, slopes)
range_sigma_shared: 3.0        # [m] shared by the rows using one reading (range noise, beam footprint off the plane); 0: independent rows
range_huber_k: 3.0
range_min: 0.0                 # valid ranges in (min, max]; set max below a "no return" value if the sensor reports one
range_max: 190.0
range_max_tilt_deg: 45.0
range_max_gap: 0.1             # [s] between the two readings interpolated at a clone's time
range_min_height: 5.0          # [m] no rows below (take-off, landing: features too close)
range_min_parallax: 0.05       # no range row below this baseline / depth (the feature's image rows are kept)
range_slam_init: true          # create SLAM features with the range (on the plane when parallax is low)
range_outlier_max_dev: 5.0     # [m] drop a reading whose ground height is this far from the window's median (tree, roof); 0: off

# ==================================================================
# Simulation (run_simulation): a 100 m flight over flat ground, with the camera, IMU noise and rangefinder
# above. The filter starts from ground truth. Set use_range: false for the vision-only baseline.
# ==================================================================
sim_seed_state_init: 0
sim_seed_preturb: 0
sim_seed_measurements: 0
sim_do_perturbation: false
sim_traj_path: "src/open_vins/ov_data/sim/flight_100m.txt"
sim_distance_threshold: 1.0
sim_freq_cam: 15
sim_freq_imu: 400
sim_min_feature_gen_dist: 5.0
sim_max_feature_gen_dist: 400.0
sim_ground_plane: true
sim_ground_height: 0.0
sim_ground_gradient: [ 0.0, 0.0 ]
sim_ground_roughness: 1.0
sim_ground_hills: [ 0.0, 300.0 ]  # [amplitude, wavelength] [m] of hills on the plane; amplitude 0: none
sim_range_freq: 20.0
sim_range_sigma: 0.1
sim_range_outlier_prob: 0.0
sim_range_outlier_max: 0.0
